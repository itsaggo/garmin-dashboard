<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <title>Training Dashboard</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.svg">
</head>
<body class="dash press">
<header class="appbar">
  <a class="brand" href="/"><img src="/static/favicon.svg" alt="" width="28" height="28"><span>Garmin Dashboard</span></a>
  <div class="appbar-r">
    <nav class="tabs" aria-label="Pages">
      <a href="#main" data-tab="main" class="tab">Today</a>
      <a href="#details" data-tab="details" class="tab">Details</a>
      <a href="/recap" class="tab">Recap</a>
      <a href="/settings" class="tab">Settings</a>
    </nav>
    <button type="button" class="icon-btn" id="syncBtn" title="Sync now" aria-label="Sync now">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1M18 3v4.5h-4.5M6 21v-4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main class="board-wrap">
  <div class="dateline">
    <p class="eyebrow"><b id="today"></b><span id="raceWeek"></span></p>
    <div class="dl-r">
      <span class="eyebrow" id="syncInfo">Loading…</span>
      <div class="seg range" id="range" role="group" aria-label="Chart range">
        <button type="button" data-days="30">30d</button>
        <button type="button" data-days="90" aria-pressed="true">90d</button>
        <button type="button" data-days="180">6m</button>
        <button type="button" data-days="365">1y</button>
      </div>
    </div>
  </div>
  <div id="banners"></div>
  <section class="board" id="sec-main" data-section="main" aria-label="Today"></section>
  <section class="board" id="sec-details" data-section="details" aria-label="Details" hidden></section>
  <footer class="foot-note">
    <span>Training guidance from your own data, not medical advice.</span>
    <span><span id="counts"></span> · <a href="/settings#customize">Customize this page</a> · <a href="/raw">Raw data</a></span>
  </footer>
</main>

<nav class="bottom-nav" aria-label="Pages">
  <a href="#main" data-tab="main">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Today</a>
  <a href="#details" data-tab="details">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Details</a>
  <a href="/recap">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg>Recap</a>
  <a href="/settings">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>Settings</a>
</nav>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/grid.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
